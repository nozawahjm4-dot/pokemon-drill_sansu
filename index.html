<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ポケモンずかんドリル 入学準備 さんすう</title>
<meta name="description" content="ポケモンといっしょに入学準備！バトルマップをすすんでドリルをとき、ポケモンをゲットしよう。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#ff4d5e;--red-d:#c9283a;--yellow:#ffd23f;--yellow-d:#e0a800;
  --blue:#3b82f6;--blue-d:#1e4fb8;--green:#34c77b;--green-d:#1f9257;
  --ink:#1f2544;--card:rgba(255,255,255,.95);--shadow:0 6px 0 rgba(0,0,0,.18),0 12px 24px rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:'M PLUS Rounded 1c',sans-serif;color:var(--ink);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{background:#2a757e}
button{font-family:inherit;cursor:pointer;border:none}
img{-webkit-user-drag:none}

/* ===== random background ===== */
#bg-image-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;transition:opacity 1s}
#bg-image-layer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(20,35,50,.45))}

/* ===== header ===== */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;background:linear-gradient(180deg,var(--red),var(--red-d));box-shadow:0 4px 0 #222,0 8px 18px rgba(0,0,0,.3);border-bottom:4px solid #222}
header h1{margin:0;font-size:clamp(15px,3.6vw,22px);font-weight:900;color:#fff;text-shadow:2px 2px 0 #222;letter-spacing:.03em;white-space:nowrap}
header h1 small{display:block;font-size:.55em;opacity:.9}
.hdr-spacer{flex:1}
.pt{background:#fff;border:3px solid #222;border-radius:999px;padding:4px 12px;font-weight:900;font-size:16px;box-shadow:0 3px 0 #222;white-space:nowrap}
.pt.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.3)}}
.hbtn{background:#fff;border:3px solid #222;border-radius:14px;padding:5px 10px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #222;transition:transform .1s}
.hbtn:active{transform:translateY(3px);box-shadow:0 0 0 #222}

/* ===== screens ===== */
.screen{display:none;padding-top:var(--hdr,64px)}
.screen.active{display:block}

/* ===== map (完全左右フルスクリーン・余白なし) ===== */
#map{width:100vw;max-width:100vw;height:calc(100vh - var(--hdr, 64px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#map-wrapper{position:relative;width:100vw;max-width:100vw;height:2800px;overflow:hidden;background:#358088}
#map-img{position:absolute;top:0;left:0;width:calc(100vw * 2048 / 1480);height:2800px;object-fit:fill;pointer-events:none}

/* バトルマス */
.tile{position:absolute;width:56px;height:56px;border-radius:16px;transform:translate(-50%,-50%);
  background:#fff;border:4px solid var(--blue);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:20px;color:var(--blue-d);box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .12s;z-index:2}
.tile:active{transform:translate(-50%,-45%) scale(.95)}
.tile.cleared{background:var(--green);border-color:var(--green-d);color:#fff}
.tile.cleared::after{content:"✓";position:absolute;right:-8px;bottom:-8px;background:#fff;color:var(--green-d);border:3px solid var(--green-d);
  width:24px;height:24px;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:900}
.tile.current{background:var(--yellow);border-color:var(--yellow-d);color:#6b4a00;animation:pulse 1.2s infinite;z-index:3}
.tile.locked{filter:saturate(.5) brightness(.92)}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 0 0 rgba(255,210,63,.9)}50%{box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 0 16px rgba(255,210,63,0)}}
.badge{position:absolute;top:-38px;left:50%;width:32px;height:32px;margin-left:-16px;border-radius:50%;border:3px solid #fff;
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 6px rgba(0,0,0,.4);animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== battle ===== */
#battle{min-height:100vh}
.battle-wrap{max-width:820px;margin:0 auto;padding:12px 12px 140px}
.card{background:var(--card);border:4px solid #222;border-radius:24px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;backdrop-filter:blur(6px)}
.poke-stage{position:relative;text-align:center;padding:12px 0 6px;background:radial-gradient(ellipse at 50% 85%,rgba(0,0,0,.18) 0 22%,transparent 23%),linear-gradient(180deg,#bfe6ff,#e8ffe0)}
.poke-stage img{width:min(48vw,230px);height:min(48vw,230px);object-fit:contain;animation:idle 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.poke-stage img.caught{animation:shrink .5s forwards}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shrink{to{transform:scale(0);opacity:0}}
.poke-name{font-weight:900;font-size:22px;margin-top:4px}
.type-chip{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;font-size:13px;font-weight:800;margin:3px;border:2px solid rgba(0,0,0,.2)}
.btitle{font-size:clamp(20px,5vw,28px);font-weight:900;margin:6px 0;text-align:center}
.bnum{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 10px;margin-right:6px;font-size:.7em;vertical-align:middle}
.desc-row{display:flex;gap:10px;align-items:flex-start}
.desc{flex:1;font-size:18px;line-height:1.7;font-weight:700}
.voice{flex:none;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:24px;border:3px solid #222;box-shadow:0 4px 0 #222}
.voice:active{transform:translateY(3px);box-shadow:none}
.voice.speaking{animation:pulse 1s infinite}
.sheet{width:100%;border-radius:14px;border:3px solid #222;display:block;cursor:zoom-in}
.sheet-err{padding:20px;text-align:center;color:#777;font-weight:700}
.q{padding:14px;border-radius:18px;background:#f4f8ff;border:3px dashed #9db8ec;margin:12px 0}
.q-label{font-weight:900;font-size:20px;margin-bottom:10px;line-height:1.5}
.q-label .box{display:inline-block;min-width:48px;padding:0 8px;border:3px solid var(--ink);border-radius:10px;text-align:center;background:#fff;color:var(--red-d)}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{min-width:68px;padding:12px 16px;font-size:22px;font-weight:900;background:#fff;border:3px solid #222;border-radius:16px;box-shadow:0 4px 0 #222;transition:transform .08s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #222}
.choice.sel{background:var(--yellow);transform:translateY(2px);box-shadow:0 2px 0 #222}
.prompt-note{font-size:13px;color:#555;background:#fffbe6;border-radius:12px;padding:8px 12px;margin-top:8px}
.prompt-note summary{font-weight:800;cursor:pointer}
.bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:12px;justify-content:center;padding:12px;background:linear-gradient(0deg,rgba(0,0,0,.4),transparent)}
.big{font-size:20px;font-weight:900;padding:14px 24px;border-radius:999px;border:4px solid #222;box-shadow:0 6px 0 #222;color:#fff}
.big:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #222}
.big.throw{background:linear-gradient(180deg,#ff6b6b 0 48%,#222 48% 54%,#fff 54%);color:#222;text-shadow:0 0 6px #fff,0 0 6px #fff;min-width:240px}
.big.back{background:var(--blue)}
.big:disabled{filter:grayscale(1) opacity(.55);cursor:not-allowed}

/* pokeball throw */
.ball{position:fixed;width:56px;height:56px;z-index:200;border-radius:50%;border:4px solid #222;
  background:linear-gradient(180deg,#ff4d5e 0 46%,#222 46% 54%,#fff 54%);pointer-events:none}
.ball::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;border:3px solid #222}
.ball.shake{animation:shake .5s 3}
@keyframes shake{25%{transform:rotate(-25deg)}75%{transform:rotate(25deg)}}
.stars{position:fixed;pointer-events:none;z-index:210;font-size:32px;animation:star 1s forwards}
@keyframes star{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* ===== modals ===== */
.modal{position:fixed;inset:0;z-index:300;background:rgba(10,15,40,.65);display:none;align-items:center;justify-content:center;padding:14px}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{background:#fff;border:5px solid #222;border-radius:28px;box-shadow:var(--shadow);width:min(680px,100%);max-height:88vh;overflow:auto;padding:22px;position:relative;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.6)}}
.mbox h2{margin:0 0 12px;text-align:center;font-weight:900}
.mclose{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;font-size:20px;font-weight:900;border:3px solid #222}
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kana{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,34px);font-weight:900;border-radius:14px;background:#fff6d6;border:3px solid #e8c766;cursor:pointer}
.kana:active{background:var(--yellow)}
.kana.empty{visibility:hidden}
.zukan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.zk{border:3px solid #222;border-radius:16px;padding:4px;text-align:center;background:#f2f6ff;font-size:12px;font-weight:800}
.zk img{width:100%;aspect-ratio:1;object-fit:contain}
.zk.no img{filter:grayscale(1) brightness(0);opacity:.35}
.zk.no{background:#ddd;color:#888}
.progress{height:16px;border-radius:999px;background:#eee;border:3px solid #222;overflow:hidden;margin-bottom:12px}
.progress>div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--green));transition:width .5s}
.center{text-align:center}
.legend img{width:210px;height:210px;object-fit:contain;animation:idle 2s infinite,glow 2s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 24px #ff9ecd)}}
.input{font-family:inherit;font-size:24px;font-weight:800;padding:12px 14px;border:4px solid #222;border-radius:16px;width:100%;text-align:center}
.mbtn{margin-top:16px;font-size:20px;font-weight:900;padding:12px 28px;border-radius:999px;border:4px solid #222;box-shadow:0 5px 0 #222;background:var(--yellow)}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #222}
.reward img{width:240px;max-width:70vw;border-radius:20px;border:5px solid gold;box-shadow:0 0 30px gold;background:radial-gradient(#fff,#ffe9a8)}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:400;background:#fff;border:5px solid #222;border-radius:24px;padding:20px 28px;font-size:24px;font-weight:900;box-shadow:var(--shadow);display:none;text-align:center}
.toast.show{display:block;animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:500;background:rgba(255,255,255,.9);font-weight:900;font-size:20px}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid #222;background:linear-gradient(180deg,var(--red) 0 46%,#222 46% 54%,#fff 54%);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){.hbtn{font-size:12px;padding:4px 7px}.pt{font-size:14px}}
</style>
</head>
<body>
<div id="bg-image-layer"></div>

<header id="hdr">
  <h1>⚡ ポケモンずかんドリル<small>入学準備 さんすう</small></h1>
  <div class="hdr-spacer"></div>
  <span class="pt" id="pt">🪙 0 pt</span>
  <button class="hbtn" id="btnKana">📋 あいうえお表</button>
  <button class="hbtn" id="btnZukan">📖 ずかん</button>
  <button class="hbtn" id="btnQuit">🚪 おわる</button>
</header>

<main>
  <!-- マップ画面 -->
  <section id="map" class="screen active" aria-label="バトルマップ">
    <div id="map-wrapper">
      <img id="map-img" src="image_0b9ff5.jpg" alt="バトルマップ">
    </div>
  </section>

  <!-- バトル画面 -->
  <section id="battle" class="screen" aria-label="バトル">
    <div class="battle-wrap">
      <div class="card poke-stage">
        <img id="bPoke" alt="ポケモン">
        <div class="poke-name" id="bName"></div>
        <div id="bTypes"></div>
      </div>
      <div class="card">
        <h2 class="btitle" id="bTitle"></h2>
        <div class="desc-row">
          <p class="desc" id="bDesc"></p>
          <button class="voice" id="btnVoice" aria-label="よみあげ">🔊</button>
        </div>
      </div>
      <div class="card" id="bSheetCard"></div>
      <div class="card" id="bQuestions"></div>
    </div>
    <div class="bottom-bar">
      <button class="big back" id="btnBack">🗺️ マップにもどる</button>
      <button class="big throw" id="btnThrow" disabled>ボールを なげる！</button>
    </div>
  </section>
</main>

<!-- 初回モーダル：でんせつのポケモン ミュウ -->
<div class="modal" id="mWelcome"><div class="mbox center legend">
  <h2>でんせつの ポケモン ミュウが あらわれた！</h2>
  <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/151.png" alt="ミュウ">
  <p style="font-size:18px;font-weight:800">ミュウ「みゅう！ ようこそ！<br>きみの おなまえを おしえてね！」</p>
  <input class="input" id="nameInput" maxlength="10" placeholder="おなまえ">
  <button class="mbtn" id="btnStart">ぼうけんに でる！</button>
</div></div>

<!-- あいうえお表モーダル -->
<div class="modal" id="mKana"><div class="mbox">
  <button class="mclose" data-close>✕</button>
  <h2>📋 あいうえお表</h2>
  <p class="center" style="margin-top:-6px">もじを タップすると よみあげるよ</p>
  <div class="kana-grid" id="kanaGrid"></div>
</div></div>

<!-- ポケモンずかんモーダル -->
<div class="modal" id="mZukan"><div class="mbox">
  <button class="mclose" data-close>✕</button>
  <h2>📖 ポケモンずかん</h2>
  <div class="center" id="zkCount" style="font-weight:900"></div>
  <div class="progress"><div id="zkBar"></div></div>
  <div class="zukan-grid" id="zukanGrid"></div>
</div></div>

<!-- モンコレごほうびモーダル -->
<div class="modal" id="mReward"><div class="mbox center reward">
  <h2 id="rwTitle">🎁 ごほうび！</h2>
  <img id="rwImg" alt="モンコレ">
  <p id="rwText" style="font-size:18px;font-weight:800"></p>
  <button class="mbtn" data-close>やったー！</button>
</div></div>

<!-- プリント拡大モーダル -->
<div class="modal" id="mSheet"><div class="mbox" style="width:min(1000px,100%)">
  <button class="mclose" data-close>✕</button>
  <img id="sheetBig" style="width:100%" alt="ドリル">
</div></div>

<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div>よみこみちゅう…</div>

<!-- 埋め込みドリルデータ -->
<script type="text/plain" id="csv-data">
battle,pokemon_name,pokemon_type,title,prompt,description,options,correct,image_link
hyoushi,ミュウ,エスパー,ポケモンずかんボード・表紙,【ポケモンずかんボード】獲得したポケモンシールを収集・一覧できるコレクションダッシュボード。全55種類のポケモンスロットがグリッド配置され、各バトルクリアでシールが貼られ図鑑が完成していくUI。,バトルを クリアして、あつめた ポケモンの シールを ずかんに はっていこう！ ぜんぶの ポケモンを あつめられるかな？,【UI構成】図鑑グリッド一覧、タイプ別フィルタ、ポケモン詳細モーダル、進捗バー,全55問クリアでマスターボール＆ミュウ解放,ずかんボード画像
Battle1,アチャモ,ほのお,たりるかな,【たりるかな（1対1対応）】アチャモ7匹とりんご8個を画面に表示。①アチャモとりんごをタップで線結び対応。②どちらが多いかを2択で選択。③「りんごはたりますか？」を「たりる」「たりない」ボタンで回答。,アチャモと りんごを せんで むすびましょう。どちらが おおいかな？ りんごは たりますか？,【選択肢】アチャモ / りんご、【判定ボタン】たりる / たりない,②りんご、③たりる,Battle1画像
Battle2,ヨーデリー,ノーマル,ポケモンをかぞえよう,【ポケモンをかぞえよう】枠内に散らばったヨーデリー(6匹)とチラーミィ(7匹)をタップしてカウント。数えた数だけゲージの○を点灯させ、最終的な匹数を数字ボタンで答える。,わくの なかの ヨーテリーと チラーミィを タップして かぞえましょう。なんびき いるか すうじを えらんでね。,【UI要素】タップで印が付くカウントエリア、1〜10の数字ボタン,ヨーデリー: 6匹、チラーミィ: 7匹,Battle2画像
Battle3,パチリス,でんき,1から 5の すうじを かこう,【1から5のすうじ】表示されたパチリスの数（1〜5匹）に合わせて、10フレームの○をタップして塗り、対応する数字（1〜5）を選択または手書き入力する。,パチリスの かずだけ ○を タップして ぬりましょう。そのあと、あてはまる すうじを えらんでね。,【UI要素】10フレーム（タップで点灯）、1〜5の数字選択ボタン,"1匹=1, 2匹=2, 3匹=3, 4匹=4, 5匹=5",Battle3画像
Battle4,ピッピ,フェアリー,せんでむすぼう,【せんでむすぼう(1〜5)】「ピッピの絵（1〜5匹）」「赤丸カード（●1〜5個）」「数字（1〜5）」の3列をタップまたはスワイプで結ぶ3者対応マッチングUI。,かずが おなじに なるように、ピッピと ●と すうじを せんで つなぎましょう。,【UI要素】ピッピ列(1〜5)、赤丸列(●1〜5)、数字列(1〜5)のマッチングノード,"ピッピ1=●1=1, ピッピ2=●2=2, ピッピ3=●3=3, ピッピ4=●4=4, ピッピ5=●5=5",Battle4画像
Battle5,フシギソウ,くさ,5はいくつといくつ,【5の分解(1)】5個のりんごを2枚の皿に分ける。上皿にあるりんご（1個、2個）を見て、下皿に必要な個数をドラッグして置き、空欄に数字を入力。,ぜんぶで 5この りんごが あります。したの おさらに りんごを わけて、あてはまる すうじを かきましょう。,【UI要素】りんごドラッグ可能パレット、数字キーパッド(1〜5),1と【4】、2と【3】,Battle5画像

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'').trim();
  const rows=[]; let row=[], f='', q=false;
  for(let i=0; i<text.length; i++){
    const c=text[i];
    if(q){
      if(c=='"'){
        if(text[i+1]=='"'){ f+='"'; i++; }
        else { q=false; }
      } else { f+=c; }
    } else {
      if(c=='"'){ q=true; }
      else if(c==','){ row.push(f); f=''; }
      else if(c=='\n'||c=='\r'){
        if(c=='\r' && text[i+1]=='\n') i++;
        row.push(f);
        if(row.some(x=>x.trim())) rows.push(row);
        row=[]; f='';
      } else {
        f+=c;
      }
    }
  }
  if(f || row.length){ row.push(f); if(row.some(x=>x.trim())) rows.push(row); }
  if(!rows.length) return [];
  const head = rows.shift().map(h=>h.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}

const shuffle = a => {
  const arr = [...a];
  for(let i=arr.length-1; i>0; i--){
    const j=Math.random()*(i+1)|0;
    [arr[i], arr[j]]=[arr[j], arr[i]];
  }
  return arr;
};

const toHalf = s => (s||'').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0));

function toast(msg, ms=1600){
  const t=$('toast');
  t.innerHTML=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'), ms);
}

function speak(text, btn){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.pitch = 1.15;
  const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));
  if(v) u.voice = v;
  if(btn){
    btn.classList.add('speaking');
    u.onend = u.onerror = () => btn.classList.remove('speaking');
  }
  speechSynthesis.speak(u);
}

function numChoices(ans){
  const n = parseInt(ans, 10);
  const set = new Set([n]);
  const span = n >= 20 ? 5 : 3;
  while(set.size < 4){
    const d = n + Math.round((Math.random() * 2 - 1) * span);
    if(d >= 0 && d !== n) set.add(d);
  }
  return shuffle([...set]).map(String);
}

function textChoices(ans, row){
  for(const g of row.options.split(/[、]/)){
    const parts = g.replace(/^.*】/, '').split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean);
    if(parts.length > 1 && parts.some(p => p.includes(ans) || ans.includes(p))) return shuffle(parts);
  }
  const words = [...new Set((row.prompt + row.description).match(/[ァ-ヶー]{2,}/g) || [])].filter(w => w !== ans).slice(0, 2);
  return shuffle([ans, ...words]);
}

function buildQuestions(row){
  if(SPECIAL_DRILLS[row.battle]) return SPECIAL_DRILLS[row.battle];

  const c = toHalf(row.correct || '');
  const qs = [];
  const isNum = s => /^\d+$/.test(s);
  const add = (label, ans) => {
    ans = ans.trim();
    qs.push({ label, ans, choices: isNum(ans) ? numChoices(ans) : textChoices(ans, row) });
  };
  const segs = c.split(/[、,]/).map(s=>s.trim()).filter(Boolean);

  if(/【[^】]+】/.test(c)){
    segs.forEach(seg => {
      const ms = [...seg.matchAll(/【([^】]+)】/g)];
      ms.forEach((m, k) => {
        let lbl = seg;
        ms.forEach((m2, k2) => {
          lbl = lbl.replace(m2[0], k2 === k ? '<span class="box">？</span>' : `<span class="box">${m2[1]}</span>`);
        });
        add(lbl.replace(/^[①-⑩]/, ''), m[1].replace(/[匹ひきびきぴきこ本円]+$/, ''));
      });
    });
  } else if(/[①-⑩]/.test(c) && !/\d/.test(c.replace(/[①-⑩]/g, ''))){
    segs.forEach((seg, i) => add(`もんだい ${seg.match(/[①-⑩]/)?.[0] || i + 1}`, seg.replace(/[①-⑩]/g, '')));
  } else if(/:\s*\d+/.test(c)){
    segs.forEach(seg => {
      const m = seg.match(/(.+?):\s*(\d+)/);
      if(m) add(`${m[1]}は なんびき？ <span class="box">？</span>`, m[2]);
    });
  } else if(/→/.test(c) && /^[\d\s→]+$/.test(c)){
    c.split('→').forEach((n, i) => add(`わかれみち ${i + 1}：おおきい ほうは？ <span class="box">？</span>`, n));
  } else if(/=/.test(c) && segs.every(s => /=\s*\d+\s*$/.test(s))){
    segs.forEach(seg => {
      const p = seg.split('=');
      const a = p.pop();
      add(`${p.join(' = ')} = <span class="box">？</span>`, a);
    });
  } else {
    const nums = c.replace(/^順に/, '').split(/[、,\s]+/).filter(Boolean);
    if(nums.length > 1 && nums.every(isNum)){
      nums.forEach((n, i) => add(`${i + 1}つめの □ に はいる すうじ <span class="box">？</span>`, n));
    }
  }

  if(!qs.length){
    qs.push({ label: 'もんだいを といて ポケモンを ゲットしよう！', ans: 'できた！', choices: ['できた！', 'まだ'] });
  }
  return qs.slice(0, 8);
}

function layoutMap(){
  const n = ROWS.length, wrap = $('map-wrapper');
  if(!n) return;
  wrap.querySelectorAll('.tile').forEach(e => e.remove());

  ROWS.forEach((row, i) => {
    const pos = MAP_COORDS[i] || MAP_COORDS[MAP_COORDS.length - 1];
    const t = document.createElement('button');
    t.className = 'tile';
    t.id = 'tile-' + (i + 1);
    /* ボード有効幅1480px, 高さ2048px に対応するパーセンテージで配置 */
    t.style.left = ((pos[0] / 1480) * 100) + '%';
    t.style.top = ((pos[1] / 2048) * 2800) + 'px';
    t.textContent = i + 1;

    if(S.cleared.includes(i)) t.classList.add('cleared');
    else if(i === S.currentBattleIndex) t.classList.add('current');
    else if(i > S.currentBattleIndex) t.classList.add('locked');

    const tp = typeList(row.pokemon_type)[0], [ic, col] = TYPES[tp] || TYPES['ノーマル'];
    const b = document.createElement('span');
    b.className = 'badge';
    b.style.background = col;
    b.textContent = ic;
    b.title = row.pokemon_type;
    b.style.animationDelay = (i % 5 * 0.3) + 's';
    t.appendChild(b);

    t.onclick = () => {
      if(i > S.currentBattleIndex && !S.cleared.includes(i)){
        alert('まだ すすめないよ！\nまえの バトルを クリアしてね。');
        return;
      }
      openBattle(i);
    };
    wrap.appendChild(t);
  });
}

function scrollToCurrent(){
  const t = document.querySelector('.tile.current') || document.querySelector('.tile#tile-1');
  const mapEl = $('map');
  if(t && mapEl){
    const targetY = Math.max(0, t.offsetTop - mapEl.clientHeight / 2);
    mapEl.scrollTo({ top: targetY, behavior: 'smooth' });
  }
}

  img.classList.remove('caught');
  img.style.visibility = '';
  img.src = pid ? ART(pid) : ART(132);

  $('bName').textContent = row.pokemon_name + ' が あらわれた！';
  $('bTypes').innerHTML = typeList(row.pokemon_type).map(t => `<span class="type-chip" style="background:${(TYPES[t]||TYPES['ノーマル'])[1]}">${(TYPES[t]||['⭐'])[0]} ${t}</span>`).join('');
  $('bTitle').innerHTML = `<span class="bnum">バトル${i+1}</span>${row.title}`;
  $('bDesc').textContent = row.description;

  const src = row.battle + '.jpg';
  $('bSheetCard').innerHTML = `<img class="sheet" src="${src}" alt="${row.title}" onerror="this.outerHTML='<div class=sheet-err>📄 ${src} が みつかりません</div>'">
    <details class="prompt-note"><summary>📝 おうちの方へ（このバトルの内容）</summary><p>${row.prompt}</p><p>${row.options}</p></details>`;

  const im = $('bSheetCard').querySelector('img');
  if(im) im.onclick = () => { $('sheetBig').src = src; openModal('mSheet'); };

  // 問題作成
  curQs = buildQuestions(row);
  const saved = S.answers[i] || {};
  const box = $('bQuestions');
  box.innerHTML = '<h3 style="margin:0 0 8px;font-size:22px">✏️ こたえを えらぼう</h3>';

  curQs.forEach((q, qi) => {
    const d = document.createElement('div');
    d.className = 'q';
    d.innerHTML = `<div class="q-label">${q.label}</div><div class="choices"></div>`;
    q.choices.forEach(ch => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = ch;
      if(saved[qi] === ch) b.classList.add('sel');
      b.onclick = () => {
        d.querySelectorAll('.choice').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        (S.answers[i] = S.answers[i] || {})[qi] = ch;
        save();
        updateThrow();
      };
      d.querySelector('.choices').appendChild(b);
    });
    box.appendChild(d);
  });

  updateThrow();
  setTimeout(() => speak(row.title + '。' + row.description, $('btnVoice')), 400);
}

function updateThrow(){
  const a = S.answers[curIdx] || {};
  $('btnThrow').disabled = !curQs.every((q, i) => a[i] != null);
}

function backToMap(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  $('battle').classList.remove('active');
  $('map').classList.add('active');
  layoutMap();
  setTimeout(scrollToCurrent, 60);
}

function throwBall(){
  const a = S.answers[curIdx] || {};
  if(!curQs.every((q, i) => a[i] != null)) return;
  const wrong = curQs.some((q, i) => a[i] !== q.ans);
  if(wrong){
    alert('おしい！もう一度考えてみて！');
    return;
  }

  $('btnThrow').disabled = true;
  const btn = $('btnThrow').getBoundingClientRect();
  const img = $('bPoke');
  img.scrollIntoView({ behavior: 'smooth', block: 'center' });

  setTimeout(() => {
    const p = img.getBoundingClientRect();
    const ball = document.createElement('div');
    ball.className = 'ball';
    document.body.appendChild(ball);

    const sx = btn.left + btn.width / 2 - 28, sy = btn.top - 28;
    const ex = p.left + p.width / 2 - 28, ey = p.top + p.height / 2 - 28;

    ball.animate([
      { transform: `translate(${sx}px,${sy}px) rotate(0)` },
      { transform: `translate(${(sx+ex)/2}px,${Math.min(sy,ey)-160}px) rotate(540deg)` },
      { transform: `translate(${ex}px,${ey}px) rotate(1080deg)` }
    ], { duration: 800, easing: 'ease-out', fill: 'forwards' })
    .onfinish = () => {
      img.classList.add('caught');
      ball.style.transform = '';
      ball.style.left = ex + 'px';
      ball.style.top = (ey + 40) + 'px';
      ball.getAnimations().forEach(x => x.cancel());
      ball.classList.add('shake');

      setTimeout(() => {
        for(let k = 0; k < 8; k++){
          const s = document.createElement('div');
          s.className = 'stars';
          s.textContent = '⭐';
          s.style.left = (ex + 14) + 'px';
          s.style.top = (ey + 50) + 'px';
          s.style.setProperty('--dx', (Math.cos(k / 8 * 6.28) * 110) + 'px');
          s.style.setProperty('--dy', (Math.sin(k / 8 * 6.28) * 110) + 'px');
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1000);
        }
        ball.remove();
        onCaught();
      }, 1600);
    };
  }, 350);
}

function onCaught(){
  const row = ROWS[curIdx];
  const first = !S.cleared.includes(curIdx);
  const name = row.pokemon_name.replace(/[(（].*$/, '');

  if(first){
    S.cleared.push(curIdx);
    if(S.currentBattleIndex === curIdx) S.currentBattleIndex = Math.min(curIdx + 1, ROWS.length);
    S.points += POINT_PER_CLEAR;
    if(!S.caught.includes(name)) S.caught.push(name);
    save();
    updatePoints(true);
  }

  speak(name + '、ゲットだぜ！');
  toast(`🎉 ${name} ゲット！${first ? `<br>🪙 +${POINT_PER_CLEAR} pt` : ''}`, 1800);
  setTimeout(() => { backToMap(); checkRewards(); }, 1900);
}

/* ================= ごほうび ================= */
function checkRewards(){
  if(Math.floor(S.points / REWARD_STEP) > S.rewardsGiven){
    S.rewardsGiven = Math.floor(S.points / REWARD_STEP);
    save();
    showReward(`🎁 ${S.rewardsGiven * REWARD_STEP}pt たっせい！`, `${S.name}さん すごい！ モンコレを ゲットしたよ！`);
    return;
  }
  if(ROWS.length && S.cleared.length >= ROWS.length && !S.allClearRewarded){
    S.allClearRewarded = true;
    save();
    showReward('🏆 ドリル ぜんぶ クリア！', `${S.name}さん おめでとう！ ごほうびの モンコレだよ！`);
  }
}

function showReward(title, text){
  const m = MONCOLLE[Math.random() * MONCOLLE.length | 0];
  const im = $('rwImg');
  im.onerror = () => { im.onerror = null; im.src = ART(pokeId(m.name) || 25); };
  im.src = moncolleImg(m);
  im.alt = 'モンコレ ' + m.name;
  $('rwTitle').textContent = title;
  $('rwText').innerHTML = `${text}<br><span style="font-size:22px;color:#c9283a">✨ モンコレ「${m.name}」✨</span>`;
  openModal('mReward');
  speak(title.replace(/[^\p{L}\p{N}]/gu, ' '));
}

/* ================= モーダル ================= */
function buildKana(){
  const K = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもや＿ゆ＿よらりるれろわ＿＿＿をん＿＿＿＿';
  $('kanaGrid').innerHTML = [...K].map(c => c === '＿' ? '<div class="kana empty"></div>' : `<div class="kana">${c}</div>`).join('');
  $('kanaGrid').onclick = e => { if(e.target.classList.contains('kana')) speak(e.target.textContent); };
}

function buildZukan(){
  const names = [...new Set(ROWS.map(r => r.pokemon_name.replace(/[(（].*$/, '')))];
  const got = names.filter(n => S.caught.includes(n)).length;
  $('zkCount').textContent = `${got} / ${names.length} ひき ゲット！`;
  $('zkBar').style.width = (names.length ? (got / names.length * 100) : 0) + '%';
  $('zukanGrid').innerHTML = names.map((n, i) => {
    const c = S.caught.includes(n);
    return `<div class="zk ${c?'':'no'}"><img loading="lazy" src="${ART(pokeId(n)||132)}" alt=""><div>No.${i+1}<br>${c ? n : '？？？'}</div></div>`;
  }).join('');
}

function updatePoints(bump){
  const p = $('pt');
  p.textContent = `🪙 ${S.points} pt`;
  if(bump){
    p.classList.remove('bump');
    void p.offsetWidth;
    p.classList.add('bump');
  }
}

/* ================= 初期化 ================= */
function init(){
  $('bg-image-layer').style.backgroundImage = `url("${BG_LIST[Math.random() * BG_LIST.length | 0]}")`;
  const setH = () => document.documentElement.style.setProperty('--hdr', $('hdr').offsetHeight + 'px');
  setH();
  window.addEventListener('resize', () => { setH(); if($('map').classList.contains('active')) layoutMap(); });

  updatePoints();
  buildKana();

  $('btnKana').onclick = () => openModal('mKana');
  $('btnZukan').onclick = () => { buildZukan(); openModal('mZukan'); };
  $('btnQuit').onclick = () => {
    if(confirm('きょうは ここまでに する？\n（きろくは ほぞん されているよ）')){
      if('speechSynthesis' in window) speechSynthesis.cancel();
      document.body.innerHTML = `<div class="loading" style="background:#fff"><img src="${ART(151)}" style="width:200px"><div>${S.name || ''}さん、またね！👋</div><button class="mbtn" onclick="location.reload()">もういちど あそぶ</button></div>`;
    }
  };
  $('btnBack').onclick = backToMap;
  $('btnThrow').onclick = throwBall;
  $('btnVoice').onclick = () => { const r = ROWS[curIdx]; if(r) speak(r.description, $('btnVoice')); };

  $('btnStart').onclick = () => {
    const n = $('nameInput').value.trim();
    if(!n){ toast('おなまえを いれてね'); return; }
    S.name = n;
    save();
    $('mWelcome').classList.remove('open');
    speak(`みゅう！ ${n}さん、いっしょに ぼうけんに でかけよう！`);
    toast(`🌟 ${n}さん、ぼうけんの はじまりだ！`);
  };

  if('speechSynthesis' in window) speechSynthesis.getVoices();

  // CSVパース＆起動
  const rawCsv = $('csv-data').textContent;
  ROWS = parseCSV(rawCsv).filter(r => /^(Battle|Minigame)/i.test(r.battle));
  $('loading').style.display = 'none';

  layoutMap();
  setTimeout(scrollToCurrent, 100);

  if(!S.name) openModal('mWelcome');
}

init();
</script>
